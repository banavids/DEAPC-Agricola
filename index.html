<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FarmSmart OS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="login-wrapper">
        <div class="glow-effect"></div>

        <header class="header">
            <i class="fa-solid fa-seedling logo-icon"></i>
            <h1>FarmSmart <span class="highlight">OS</span></h1>
            <p class="subtitle">AUTENTICAÇÃO DO SISTEMA</p>
        </header>

        <main class="login-card">
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">UTILIZADOR / EMAIL</label>
                    <input type="text" id="email" value="admin@farmsmart.local">
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" value="12345678">
                </div>

                <a href="#" class="forgot-password">Recuperar acesso</a>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-lock"></i>
                    ENTRAR NO SISTEMA
                </button>
            </form>

            <div class="divider">
                <span>STATUS</span>
            </div>

            <div class="status-container">
                <div class="status-box">
                    <i class="fa-solid fa-server status-icon"></i>
                    <span class="status-title">SERVIDOR CORE</span>
                    <div class="status-indicator">
                        <span class="dot"></span> Online
                    </div>
                </div>
                <div class="status-box">
                    <i class="fa-solid fa-wifi status-icon"></i>
                    <span class="status-title">MQTT BROKER</span>
                    <div class="status-indicator">
                        <span class="dot"></span> Conectado
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
