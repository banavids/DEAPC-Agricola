<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmSmart OS - Autenticação</title>
</head>
<body>

    <main>
        
        <header>
            <div class="logo-icon">🌱</div>
            <h1>FarmSmart <span>OS</span></h1>
            <p>AUTENTICAÇÃO DO SISTEMA</p>
        </header>

        <section class="login-card">
            
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="username">UTILIZADOR / EMAIL</label>
                    <input 
                        type="email" 
                        id="username" 
                        name="username" 
                        placeholder="admin@farmsmart.local" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="form-actions">
                    <a href="recuperar.html">Recuperar acesso</a>
                </div>

                <button type="submit">
                    <span>🔒</span> ENTRAR NO SISTEMA
                </button>

            </form>

            <footer class="status-section">
                <legend>STATUS</legend>
                
                <div class="status-container">
                    <div class="status-card">
                        <span class="icon">🖥️</span>
                        <h3>SERVIDOR CORE</h3>
                        <p class="online">• Online</p>
                    </div>

                    <div class="status-card">
                        <span class="icon">📶</span>
                        <h3>MQTT BROKER</h3>
                        <p class="connected">• Conectado</p>
                    </div>
                </div>
            </footer>

        </section>

    </main>

</body>
</html>
