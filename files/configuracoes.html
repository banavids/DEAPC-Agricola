<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FarmSmart OS</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="dashboard-content">
    
    <div class="page-header" style="margin-bottom: 20px;">
        <h2 class="page-title">Configurações do Sistema</h2>
        <button class="btn btn-green"><i class="fa-solid fa-floppy-disk"></i> Guardar Alterações</button>
    </div>

    <div class="light-card settings-card">
        <h3 class="settings-title"><i class="fa-solid fa-server text-blue"></i> Servidor MQTT & IoT</h3>
        <div class="form-row">
            <div class="form-group flex-2">
                <label>IP do Broker</label>
                <input type="text" class="form-control" value="mqtt.farmsmart.local">
            </div>
            <div class="form-group flex-1">
                <label>Porta</label>
                <input type="text" class="form-control" value="1883">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group flex-full">
                <label>Prefixo Tópico Base</label>
                <input type="text" class="form-control" value="farm/">
            </div>
        </div>
    </div>

    <div class="light-card settings-card">
        <h3 class="settings-title"><i class="fa-solid fa-droplet text-blue"></i> Regras de Automação (Gerais)</h3>
        <div class="form-row">
            <div class="form-group flex-1">
                <label>Humidade Mínima (%) para Rega</label>
                <input type="number" class="form-control" value="40">
            </div>
            <div class="form-group flex-1">
                <label>Duração Máxima Rega Contínua (min)</label>
                <input type="number" class="form-control" value="30">
            </div>
        </div>
    </div>

    <div class="light-card settings-card">
        <h3 class="settings-title"><i class="fa-regular fa-bell text-yellow"></i> Alertas e Notificações</h3>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" checked>
                Notificar Administradores por Email em Alertas Críticos
            </label>
            <label class="checkbox-label">
                <input type="checkbox" checked>
                Avisar Gestores de Sensores Offline (> 1h)
            </label>
        </div>
        <div class="form-row" style="margin-top: 15px;">
            <div class="form-group flex-full">
                <label>Email para Alertas</label>
                <input type="email" class="form-control" value="alertas@farmsmart.pt">
            </div>
        </div>
    </div>

</div>
</body>
