<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FarmSmart OS</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="dashboard-content">
    
    <div class="page-header">
        <h2 class="page-title">Produções Agrícolas</h2>
        <button class="btn btn-green"><i class="fa-solid fa-plus"></i> Nova Produção</button>
    </div>

    <div class="light-card full-width">
        
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Procurar produção...">
            </div>
            <button class="btn-outline"><i class="fa-solid fa-filter"></i> Filtros</button>
        </div>

        <div class="table-responsive">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>Nome / Cultura</th>
                        <th>Estado</th>
                        <th>Humidade / Temp</th>
                        <th>Operários</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <span class="td-title">Estufa 1 - Tomates</span>
                            <span class="td-sub">Tomate Cherry</span>
                        </td>
                        <td><span class="pill-badge bg-green">Ativo</span></td>
                        <td>
                            <div class="metrics">
                                <span class="text-blue"><i class="fa-solid fa-droplet"></i> 65%</span>
                                <span class="text-orange"><i class="fa-solid fa-temperature-half"></i> 24°C</span>
                            </div>
                        </td>
                        <td><span class="workers"><i class="fa-solid fa-users"></i> 3</span></td>
                        <td><button class="btn-icon"><i class="fa-solid fa-chevron-right"></i></button></td>
                    </tr>
                    <tr>
                        <td>
                            <span class="td-title">Setor Sul - Alfaces</span>
                            <span class="td-sub">Alface Lisa</span>
                        </td>
                        <td><span class="pill-badge bg-green">Ativo</span></td>
                        <td>
                            <div class="metrics">
                                <span class="text-blue"><i class="fa-solid fa-droplet"></i> 72%</span>
                                <span class="text-orange"><i class="fa-solid fa-temperature-half"></i> 21°C</span>
                            </div>
                        </td>
                        <td><span class="workers"><i class="fa-solid fa-users"></i> 2</span></td>
                        <td><button class="btn-icon"><i class="fa-solid fa-chevron-right"></i></button></td>
                    </tr>
                    <tr>
                        <td>
                            <span class="td-title">Pomar - Maçãs</span>
                            <span class="td-sub">Maçã Fuji</span>
                        </td>
                        <td><span class="pill-badge bg-yellow">Atenção</span></td>
                        <td>
                            <div class="metrics">
                                <span class="text-blue"><i class="fa-solid fa-droplet"></i> 45%</span>
                                <span class="text-orange"><i class="fa-solid fa-temperature-half"></i> 26°C</span>
                            </div>
                        </td>
                        <td><span class="workers"><i class="fa-solid fa-users"></i> 4</span></td>
                        <td><button class="btn-icon"><i class="fa-solid fa-chevron-right"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
